## File save settings ##

# Download directory. Can use absolute or relative path, default: current startup location
dir=/downloads

# Disk cache, 0 to disable cache, default: 16M
# Disk cache temporarily stores downloaded data blocks in memory, then writes them to disk in batches to reduce disk I/O, improve read/write performance, and extend disk life.
# Recommended to increase appropriately if sufficient memory is available, but do not exceed available memory space.
# This value sets the upper limit; actual memory usage depends on factors like network speed (bandwidth) and device performance.
disk-cache=64M

# File pre-allocation method, options: none, prealloc, trunc, falloc, default: prealloc
# Pre-allocation reduces disk fragmentation on mechanical HDDs, improves read/write performance, and extends disk life.
# For mechanical HDDs with ext4 (with extents), btrfs, xfs, or NTFS (MinGW builds only), recommend falloc.
# If fallocate fails with "Operation not supported", set to none.
# prealloc is slow, trunc has no real effect, not recommended.
# SSDs do not need pre-allocation; recommend none to avoid double writes affecting lifespan.
file-allocation=falloc

# File pre-allocation size limit. Files smaller than this value will not pre-allocate space, units K or M, default: 5M
no-file-allocation-limit=64M

# Resume download
continue=true

# Always attempt resume; terminate if resume unavailable, default: true
always-resume=false

# Number of URIs not supporting resume when always-resume=false.
# Download from head when reaching this number; 0 means download from head only if all URIs do not support resume.
max-resume-failure-tries=0

# Retrieve file modification time from server, default: false
remote-time=true


## Progress save settings ##

# Read download tasks from session file
input-file=/config/aria2.session

# Session file save path
# Saves `error/incomplete` tasks to session file on exit or at specified intervals
save-session=/config/aria2.session

# Interval to save session after task status change (seconds), 0 saves only on normal exit, default: 0
# Recommend 1 to save status promptly and prevent task loss
save-session-interval=1

# Interval to auto-save task progress to control file (*.aria2) (seconds), 0 saves only on normal exit, default: 60
# Indirectly affects frequency of flushing cache from memory to disk
# Increase interval to reduce disk IOPS; decrease for more progress saved on abnormal exit
# Abnormal exit: process crash, system crash, SIGKILL, power loss, etc.
auto-save-interval=20

# Force save, even for completed tasks, to session file, default: false
# Keeps .aria2 files after completion; on restart with file removed but task present, re-downloads.
# Clears completed tasks on restart if disabled.
force-save=false


## Download connection settings ##

# Retry count on file not found, default: 0 (disabled)
# Also increments retry count, so set max-tries accordingly
max-file-not-found=10

# Maximum retry attempts, 0 for unlimited, default: 5
max-tries=0

# Retry wait time (seconds), default: 0 (disabled)
retry-wait=10

# Connection timeout (seconds). Default: 60
connect-timeout=10

# Timeout (seconds). Default: 60
timeout=10

# Maximum concurrent downloads, modifiable at runtime, default: 5
max-concurrent-downloads=5

# Maximum connections per server, specifiable per task, default: 1
# Max 16 (unlimited in enhanced), limited by split.
max-connection-per-server=32

# Maximum connections per task, specifiable per task, default: 5
split=64

# Minimum file split size, specifiable per task, range 1M-1024M (1K min enhanced), default: 20M
# E.g., 10M: 20MB file splits into 2 segments from 2 sources; 15MB uses 1 source.
# Smaller values allow more segments/threads for faster speed, limited by server policy.
min-split-size=4M

# HTTP/FTP download chunk size; all splits must be multiples, min 1M (1K enhanced), default: 1M
piece-length=1M

# Allow piece length change. Default: false
# false: Abort if piece size differs from control file
# true: Continue with partial progress loss
allow-piece-length-change=true

# Minimum download speed limit. Close connection (reconnect in enhanced) if at/below, unrelated to BT, units K/M, default: 0 (unlimited)
lowest-speed-limit=0

# Global max download speed limit, modifiable at runtime, default: 0 (unlimited)
max-overall-download-limit=0

# Per-task download speed limit, default: 0 (unlimited)
max-download-limit=0

# Disable IPv6, default: false
disable-ipv6=true

# GZip support, default: false
http-accept-gzip=true

# URI reuse, default: true
reuse-uri=false

# Disable netrc support, default: false
no-netrc=true

# Allow overwrite; re-download from head if .aria2 missing, default: false
allow-overwrite=false

# Auto file renaming, effective only for HTTP(S)/FTP. Adds .number (1..9999) before extension, default: true
auto-file-renaming=true

# Use UTF-8 for Content-Disposition, default: false
content-disposition-default-utf8=true

# Minimum TLS version, options: TLSv1.1, TLSv1.2, TLSv1.3, default: TLSv1.2
#min-tls-version=TLSv1.2


## BT/PT download settings ##

# BT listen port (TCP), default: 6881-6999
# For direct internet devices (e.g., VPS), allow inbound in firewall/security groups
# For LAN devices (e.g., NAS), also set router port forward
listen-port=6888

# DHT network & UDP tracker listen port (UDP), default: 6881-6999
# Can use same port as BT due to different protocol, simplifies firewall/port forward
dht-listen-port=6888

# Enable IPv4 DHT, auto-disabled for PT (private trackers), default: true
enable-dht=true

# Enable IPv6 DHT, auto-disabled for PT, default: false
# May cause issues without IPv6 support
enable-dht6=false

# Specify IP for BT and DHT networks
# Use case: Forward BT/DHT ports to public IP server for non-public IP home broadband to boost BT speed
#bt-external-ip=

# IPv4 DHT file path, default: $HOME/.aria2/dht.dat
dht-file-path=/config/dht.dat

# IPv6 DHT file path, default: $HOME/.aria2/dht6.dat
dht-file-path6=/config/dht6.dat

# IPv4 DHT bootstrap nodes
dht-entry-point=dht.transmissionbt.com:6881

# IPv6 DHT bootstrap nodes
dht-entry-point6=dht.transmissionbt.com:6881

# Local peer discovery, auto-disabled for PT, default: false
bt-enable-lpd=true

# Interface for local peer discovery, values: interface, IP
# Defaults to default interface if unspecified
#bt-lpd-interface=

# Enable peer exchange, auto-disabled for PT, default: true
enable-peer-exchange=true

# BT max peers per task (global), modifiable at runtime. 0 unlimited, default: 55
# More connections ideally faster, but few seeds upload fast; excess may crash process or block network
# Crash: High CPU on average devices
# Block: LAN router bottleneck
bt-max-peers=128

# BT expected peer speed (per task), modifiable at runtime, units K/M, default: 50K
# If below, temporarily increases peers for faster speed if more seeds available
# No hard limit; dynamically adjusts reasonably
bt-request-peer-speed-limit=10M

# Global max upload speed limit, modifiable at runtime, default: 0 (unlimited)
# Too low may affect BT download speed
max-overall-upload-limit=2M

# Per-task upload speed limit, default: 0 (unlimited)
max-upload-limit=0

# Minimum ratio. Stop seeding when reached, 0 always seed, default: 1.0
# Strongly recommend >=1.0
seed-ratio=1.0

# Minimum seed time (minutes). 0 stops seeding after BT download complete.
seed-time=0

# Hash check seeds before seeding, default: true
bt-hash-check-seed=true

# Skip hash check when resuming BT tasks, default: false
bt-seed-unverified=false

# BT tracker connect timeout (seconds). Default: 60
# After connect, uses bt-tracker-timeout
bt-tracker-connect-timeout=10

# BT tracker timeout (seconds). Default: 60
bt-tracker-timeout=10

# BT tracker interval (seconds). Default: 0 (auto)
#bt-tracker-interval=0

# BT prioritize head/tail pieces
bt-prioritize-piece=head=32M,tail=32M

# Save .torrent from WebUI (RPC) uploads, default: true
# Recommend enabling all torrent save options to avoid task loss risk
# Custom temp dir via RPC may not save torrent
rpc-save-upload-metadata=true

# Auto-start downloads from .torrent, default: true, options: false|mem
# true: Save torrent
# false: Download torrent only
# mem: Keep in memory
follow-torrent=true

# Pause tasks after .torrent download, default: false
# With follow-torrent, creates and pauses tasks
pause-metadata=false

# Save magnet metadata as .torrent, default: false
bt-save-metadata=true

# Load saved metadata (.torrent), default: false
bt-load-saved-metadata=true

# Delete unselected files in BT tasks, default: false
bt-remove-unselected-file=true

# BT force encryption, default: false
# Rejects old BT handshake, uses obfuscated/encrypted. Bypasses some ISP blocks, reduces copyright complaints/leeching.
# Shortcut for bt-require-crypto=true, bt-min-crypto-level=arc4 without changing them.
bt-force-encryption=true

# BT require crypto, default: false
# Rejects old BitTorrent handshake, always obfuscates.
#bt-require-crypto=true

# BT min crypto level, options: plain, arc4, default: plain
#bt-min-crypto-level=arc4

# Detach seed-only tasks, default: false
# Excludes completed seeding tasks from active downloads, starts next from waitlist
bt-detach-seed-only=true


## Client spoofing ##

# Custom User Agent
user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.63 Safari/537.36 Edg/93.0.961.47

# BT client spoofing
# PT needs user-agent and peer-agent consistent
# Some PT sites ban Aria2 specifically; spoofing may not work and risks account ban
#user-agent=Deluge 1.3.15
peer-agent=Deluge 1.3.15
peer-id-prefix=-DE13F0-


## Execute additional commands ##

# Command on download stop
# Triggers from downloading to delete/error/complete. Pause marked as not started, unrelated.
on-download-stop=/config/script/delete.sh

# Command on download complete
# If undefined, uses on-download-stop
on-download-complete=/config/script/upload.sh

# Command on download error
# If undefined, uses on-download-stop
#on-download-error=

# Command on download pause
#on-download-pause=

# Command on download start
#on-download-start=

# Command on BT download complete
#on-bt-download-complete=


## RPC settings ##

# Enable JSON-RPC/XML-RPC server, default: false
enable-rpc=true

# Accept all remote origins, default: false
rpc-allow-origin-all=true

# Allow external access, default: false
rpc-listen-all=true

# RPC listen port, default: 6800
rpc-listen-port=6800

# RPC secret
rpc-secret=654550

# RPC max request size
rpc-max-request-size=10M

# RPC SSL/TLS encryption, default: false
# Use https/wss if enabled
# Not recommended; use reverse proxy like Nginx/Caddy for flexibility
#rpc-secure=false

# RPC SSL/TLS certificate (.pem/.crt)
#rpc-certificate=/config/xxx.pem

# RPC SSL/TLS private key (.key)
#rpc-private-key=/config/xxx.key

# Event polling method, options: epoll, kqueue, port, poll, select; system defaults vary
#event-poll=select


## Advanced options ##

# Enable async DNS. Default: true
#async-dns=true

# Async DNS server list; reads /etc/resolv.conf if unspecified
#async-dns-server=119.29.29.29,223.5.5.5,8.8.8.8,1.1.1.1

# Specify network interface: interface, IP, hostname
# For multi-IP interfaces, prefer IP.
# Known issue: Affects localhost/127.0.0.1 RPC connections
#interface=

# Multiple interfaces, comma-separated
# Ignored if interface set
#multiple-interface=


## Log settings ##

# Log file path; ignore/empty to disable, default: disabled
#log=

# Log level: debug, info, notice, warn, error. Default: debug
#log-level=warn

# Console log level: debug, info, notice, warn, error. Default: notice
console-log-level=notice

# Quiet mode, no console logs, default: false
quiet=false

# Download progress summary interval (seconds), 0 disables. Default: 60
summary-interval=0

# Disable console progress bar to avoid empty lines in logs
show-console-readout=false


## Enhanced extension settings (unofficial) ##

# Only for myfreeer/aria2-build-msys2 (Windows) and P3TERX/Aria2-Pro-Core (GNU/Linux) enhanced builds

# Retry on HTTP 400 Bad Request, effective if retry-wait > 0, default: false
retry-on-400=true

# Retry on HTTP 403 Forbidden, effective if retry-wait > 0, default: false
retry-on-403=true

# Retry on HTTP 406 Not Acceptable, effective if retry-wait > 0, default: false
retry-on-406=true

# Retry on unknown status codes, effective if retry-wait > 0, default: false
retry-on-unknown=true

# Send Want-Digest header. Default: false (no)
# Some sites detect/block Aria2 via this header
#http-want-digest=false



services:
  aria2-pro:
    build:
      context: .
      dockerfile: Dockerfile.aria2
    container_name: aria2-pro
    user: "0:0"
    environment:
      - RPC_SECRET=${RPC_SECRET}
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./aria2:/config
      - ./script:/config/script
      - /var/run/docker.sock:/var/run/docker.sock
      - ./downloads:/downloads
      - ./cloud-destinations.json:/config/cloud-destinations.json:ro
    networks:
      - aria2-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6800/jsonrpc -d '{\"method\":\"aria2.getVersion\",\"jsonrpc\":\"2.0\",\"id\":\"hc\",\"params\":[\"token:'${RPC_SECRET}'\"]}' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./aria2-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ariang:/usr/share/nginx/html:rw
      - ./certs:/etc/nginx/certs:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    networks:
      - aria2-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -qS http://localhost:80/ 2>&1 | grep -q '301\\|200' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  rclone:
    image: rclone/rclone
    container_name: rclone
    environment:
      - RCLONE_IGNORE_CHECKSUM=true
      - RCLONE_CHECKSUM=false
    volumes:
      - ./rclone:/config/rclone
      - ./downloads:/downloads:rw
    # ponytail: removed host port 5572 — only internal Docker network needs it. Re-expose if debugging rclone externally.
    command: rcd --rc-web-gui --rc-addr :5572 --rc-user ${RCLONE_USER} --rc-pass ${RCLONE_PASS} --rc-serve --rc-no-auth --timeout 10m --contimeout 10m --drive-chunk-size 128M --transfers 4 --buffer-size 64M --checkers 8 --low-level-retries 10
    networks:
      - aria2-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5572/core/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  filebrowser:
    image: filebrowser/filebrowser
    container_name: filebrowser
    user: "${PUID}:${PGID}"
    environment:
      - FB_BASEURL=/download
    volumes:
      - ./filebrowser.db:/database/filebrowser.db
      - ./settings.json:/config/settings.json
      - ./downloads:/srv
    networks:
      - aria2-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/download/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - aria2-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build: ./dashboard
    container_name: nexly-dashboard
    restart: unless-stopped
    environment:
      - ARIA2_URL=http://aria2-pro:6800/jsonrpc
      - ARIA2_SECRET=${RPC_SECRET}
      - RCLONE_URL=http://rclone:5572
      - RCLONE_USER=${RCLONE_USER}
      - RCLONE_PASS=${RCLONE_PASS}
    volumes:
      - /proc:/host/proc:ro
      - ./aria2/upload.log:/logs/upload.log:ro
      - ./downloads:/data:ro
      - /etc/os-release:/host/os-release:ro
      - ./cloud-destinations.json:/config/cloud-destinations.json:rw
    networks:
      - aria2-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    # ponytail: runs once then exits. Renew via: docker compose run certbot renew
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - aria2-net
    restart: unless-stopped

networks:
  aria2-net:
    driver: bridge
    name: aria2-net

volumes:
  portainer_data:
  certbot-webroot:
  certbot-certs:

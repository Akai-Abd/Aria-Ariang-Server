# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80;
    server_name nexly.dpdns.org;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name nexly.dpdns.org;

    # SSL — tries Let's Encrypt first, falls back to self-signed
    # ponytail: after running certbot, switch to /etc/letsencrypt/live/nexly.dpdns.org/fullchain.pem
    ssl_certificate /etc/nginx/certs/aria2.pem;
    ssl_certificate_key /etc/nginx/certs/aria2.key;

    # Global basic auth
    auth_basic "Nexly Server";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # AriaNg Dashboard
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Aria2 RPC — no basic auth (uses its own RPC secret)
    location /jsonrpc {
        auth_basic off;
        proxy_pass http://aria2-pro:6800/jsonrpc;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # FileBrowser
    location = /download {
        return 301 /download/;
    }

    location /download/ {
        proxy_pass http://filebrowser:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Portainer
    location = /portainer {
        return 301 /portainer/;
    }

    location /portainer/ {
        proxy_pass http://portainer:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Rclone Web UI
    location = /rclone {
        return 301 /rclone/;
    }

    location /rclone/ {
        proxy_pass http://rclone:5572/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Nexly Live Dashboard
    location = /live {
        return 301 /live/;
    }

    location /live/ {
        proxy_pass http://nexly-dashboard:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Socket.io for Dashboard
    location /socket.io/ {
        proxy_pass http://nexly-dashboard:3000/socket.io/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
